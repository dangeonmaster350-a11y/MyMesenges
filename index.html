<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>LOGO MESSAGE — безопасный мессенджер</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js для звуков -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'primary': '#1A73E8',
                        'primary-dark': '#0F4AB3',
                        'ui-bg': '#F5F7FA',
                        'ui-block': '#FFFFFF',
                        'text-main': '#1C1C1E',
                        'text-secondary': '#777777',
                        'msg-in': '#E9F2FF',
                        'msg-out': '#D3E4FF',
                        'highlight': '#E3ECFF',
                        'separator': '#E0E0E0',
                        'dark-ui-bg': '#121212',
                        'dark-ui-block': '#1E1E1E',
                        'dark-text-main': '#E0E0E0',
                        'dark-text-secondary': '#8A8A8A',
                        'dark-msg-in': '#333333',
                        'dark-msg-out': '#0F4AB3',
                        'dark-highlight': '#2a2a2a',
                        'dark-separator': '#2F2F2F',
                    },
                    fontFamily: {
                        'sans': ['Inter', 'sans-serif']
                    },
                    borderRadius: {
                        'xl': '12px',
                        '2xl': '18px',
                    }
                }
            }
        }
    </script>
    
    <style>
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #3f3f46; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-bubble { animation: fadeIn 0.3s ease-out; }
        
        @keyframes typing-bubble {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
        .typing-dot { animation: typing-bubble 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        
        .switch-toggle { transition: background-color 0.2s ease-in-out; }
        .switch-dot { transition: transform 0.2s ease-in-out; }
        input:checked + .switch-toggle { background-color: #1A73E8; }
        input:checked + .switch-toggle .switch-dot { transform: translateX(100%); }
        
        .message-container:hover .message-actions { opacity: 1; }
        .message-actions { opacity: 0; transition: opacity 0.15s ease-in-out; }
        
        .countdown-ring {
            stroke-dasharray: 283;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }
        
        /* Мобильные оптимизации */
        @media (max-width: 768px) {
            .mobile-fullscreen { height: 100vh; height: 100dvh; }
            .mobile-bottom-safe { padding-bottom: env(safe-area-inset-bottom, 0); }
        }
    </style>
</head>
<body class="bg-ui-bg text-text-main dark:bg-dark-ui-bg dark:text-dark-text-main font-sans transition-colors duration-200">

    <!-- ===== ЭКРАН ВХОДА (ШАГ 1 - Email) ===== -->
    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-ui-bg dark:bg-dark-ui-bg p-4">
        <div class="w-full max-w-sm bg-ui-block dark:bg-dark-ui-block p-6 rounded-2xl shadow-xl">
            <div class="w-16 h-16 bg-primary rounded-2xl flex items-center justify-center mx-auto mb-5">
                <span class="text-white font-bold text-3xl">FM</span>
            </div>
            <h1 class="text-2xl font-bold text-center mb-1">Добро пожаловать</h1>
            <p class="text-text-secondary dark:text-dark-text-secondary text-center text-sm mb-6">Введите email для входа или регистрации</p>
            
            <form id="email-form" class="space-y-4">
                <div>
                    <input type="email" id="email-input" placeholder="example@mail.com" 
                           class="w-full bg-ui-bg dark:bg-dark-ui-bg border border-separator dark:border-dark-separator rounded-xl py-3 px-4 focus:outline-none focus:ring-2 focus:ring-primary">
                    <p id="email-error" class="text-red-500 text-xs mt-2 hidden">Введите корректный email</p>
                </div>
                <button type="submit" class="w-full py-3 bg-primary text-white rounded-xl hover:bg-primary-dark transition-all font-semibold">
                    Продолжить
                </button>
            </form>
        </div>
    </div>

    <!-- ===== ЭКРАН КОДА (ШАГ 2 - 2FA) ===== -->

            <button id="back-to-email-btn" class="text-text-secondary mb-4 text-sm flex items-center gap-1 hover:text-primary">
                ← Назад
            </button>
            <div class="w-16 h-16 bg-primary/10 rounded-2xl flex items-center justify-center mx-auto mb-5">
                <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            </div>
            <h2 class="text-xl font-bold text-center mb-1">Подтверждение</h2>
            <p class="text-text-secondary text-center text-sm mb-3">Код отправлен на <span id="code-email-display" class="font-medium text-primary"></span></p>
            
            <div id="timer-container" class="text-center mb-4">
                <div class="relative inline-flex items-center justify-center">
                    <svg class="w-16 h-16 transform -rotate-90">
                        <circle cx="32" cy="32" r="28" stroke="currentColor" stroke-width="3" fill="none" class="text-gray-200 dark:text-gray-700"/>

                    </svg>
                    <span id="timer-seconds" class="absolute text-xl font-bold text-primary">02:00</span>
                </div>
            </div>
            
            <form id="code-form" class="space-y-4">
                <div>
                    <input type="text" id="code-input" placeholder="Введите 6-значный код" maxlength="6" 
                           class="w-full bg-ui-bg dark:bg-dark-ui-bg border border-separator dark:border-dark-separator rounded-xl py-3 px-4 text-center text-2xl tracking-widest focus:outline-none focus:ring-2 focus:ring-primary">
                    <p id="code-error" class="text-red-500 text-xs mt-2 hidden">Неверный или просроченный код</p>
                </div>
                <button type="submit" class="w-full py-3 bg-primary text-white rounded-xl hover:bg-primary-dark transition-all font-semibold">
                    Войти
                </button>
                <button type="button" id="resend-code-btn" class="w-full py-2 text-text-secondary text-sm hover:text-primary transition-all">
                    Отправить код повторно
                </button>
            </form>
        </div>
    </div>

            </div>
        </div>
