<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Telegram Clone</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Боковая панель (диалоги) -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="user-info">
                    <img src="https://randomuser.me/api/portraits/men/1.jpg" alt="avatar" class="avatar">
                    <span class="username">Мой аккаунт</span>
                </div>
                <div class="header-actions">
                    <i class="fas fa-edit"></i>
                    <i class="fas fa-cog"></i>
                </div>
            </div>
            
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Поиск" id="searchInput">
            </div>

            <div class="chats-list" id="chatsList">
                <!-- Чаты будут добавляться динамически -->
            </div>
        </div>

        <!-- Основная область чата -->
        <div class="chat-area">
            <div class="chat-header" id="chatHeader">
                <div class="chat-user">
                    <img src="" alt="avatar" class="avatar" id="chatAvatar">
                    <div>
                        <h3 id="chatName">Выберите чат</h3>
                        <span class="status" id="chatStatus">онлайн</span>
                    </div>
                </div>
                <div class="chat-actions">
                    <i class="fas fa-phone"></i>
                    <i class="fas fa-video"></i>
                    <i class="fas fa-info-circle"></i>
                </div>
            </div>

            <div class="messages-area" id="messagesArea">
                <div class="welcome-message">
                    <i class="fas fa-telegram-plane"></i>
                    <h2>Добро пожаловать в Telegram Clone</h2>
                    <p>Выберите диалог, чтобы начать общение</p>
                </div>
            </div>

            <div class="message-input-container">
                <div class="input-attachments">
                    <i class="fas fa-paperclip"></i>
                    <i class="fas fa-smile"></i>
                    <i class="fas fa-microphone"></i>
                </div>
                <input type="text" id="messageInput" placeholder="Сообщение" disabled>
                <button id="sendBtn" disabled><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>

        <!-- Панель информации о пользователе (опционально) -->
        <div class="info-panel" id="infoPanel">
            <div class="info-header">
                <i class="fas fa-times" id="closeInfo"></i>
                <h3>Информация</h3>
            </div>
            <div class="info-content">
                <img src="" alt="avatar" id="infoAvatar">
                <h4 id="infoName"></h4>
                <p id="infoBio"></p>
                <div class="info-actions">
                    <button><i class="fas fa-bell-slash"></i> Выкл. уведомления</button>
                    <button><i class="fas fa-trash"></i> Очистить историю</button>
                    <button class="danger"><i class="fas fa-ban"></i> Заблокировать</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
