<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лог отправленных кодов</title>
    <style>
        body {
            font-family: monospace;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        h1 {
            color: #1A73E8;
        }
        .log-entry {
            background: #2d2d2d;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #1A73E8;
        }
        .timestamp {
            color: #888;
            font-size: 12px;
        }
        .phone {
            color: #4ec9b0;
        }
        .code {
            color: #ce9178;
            font-weight: bold;
            font-size: 18px;
        }
        .email {
            color: #9cdcfe;
        }
    </style>
</head>
<body>
    <h1>📧 Лог отправленных кодов подтверждения</h1>
    <p>При входе в мессенджер коды отображаются здесь (имитация почты)</p>
    <div id="log-container"></div>

    <script>
        // Слушаем сообщения от основного приложения
        window.addEventListener('storage', (e) => {
            if (e.key === 'verification_log') {
                addLogEntry(JSON.parse(e.newValue));
            }
        });

        function addLogEntry(data) {
            const container = document.getElementById('log-container');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `
                <div class="timestamp">${new Date().toLocaleString()}</div>
                <div>📱 Телефон: <span class="phone">${data.phone}</span></div>
                <div>📧 Почта: <span class="email">${data.email}</span></div>
                <div>🔑 Код: <span class="code">${data.code}</span></div>
                <div>⏱️ Действителен: 5 минут</div>
            `;
            container.prepend(entry);
        }

        // Загружаем существующие логи
        const logs = JSON.parse(localStorage.getItem('verification_logs') || '[]');
        logs.forEach(addLogEntry);
    </script>
</body>
</html>
